[package]
name = "rs-arrow-ints2zeek"
version = "0.1.0"
edition = "2024"

description = "Converts the ints in the array to zstd seekable."
license = "Apache-2.0"
repository = "https://github.com/takanoriyanagitani/rs-arrow-ints2zeek"
documentation = "https://docs.rs/rs-arrow-ints2zeek/latest"
keywords = ["arrow", "seekable", "integer", "zstd", "convert"]

exclude = [
  "arrow-ints2zeek.wasm",
]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "forbid"
expect_used = "forbid"
panic = "forbid"

[profile.release-wasi]
inherits = "release"
lto = true
strip = true
opt-level = 's'
codegen-units = 1

[[example]]
name = "arrow-ints2zeek"

[dependencies.zrip]
version = "0.8.16"
default-features = false
features = [
  "frame",
  "ldm",
  "simd",
  "std",
]

[dependencies.arrow-array]
version = "60.1.0"
default-features = false
features = [
]

[dependencies.arrow-schema]
version = "60.1.0"
default-features = false
features = [
]
